name: Update publications from Google Scholar

on:
  schedule:
    - cron: "17 6 * * 1"   # every Monday 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-publications
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sync publications
        run: python scripts/update_publications.py

      - name: Rebuild sitemap
        run: python scripts/build_sitemap.py

      - name: Commit changes
        run: |
          if git diff --quiet -- index.html data/ sitemap.xml; then
            echo "No publication changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html data/ sitemap.xml
          git commit -m "Update publications from Google Scholar"
          git push
